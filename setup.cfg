[build_ext]
inplace=1

[gcovr]
# Automatically exclude all "tests" directories at any level.
# The regex (^|/)tests/.* matches:
#   tests/file.cpp          (root-level tests dir)
#   python/tests/file.cpp   (nested)
#   csrc/layers/tests/...   (deeply nested)
# It does NOT match directory names like my_tests/ or tests_utils/.
exclude = (^|/)tests/.*

[general]
log_level = INFO
log_dir = ./log
cluster_name = default_cluster
heartbeat_timeout_seconds = 60

[name_service]
name_service_provider = name_service.auto_provider
namespace = Production
prefill_service = prefill-service
decode_service = decode-service

[database]
# storage_mode: sqlite or mysql
storage_mode = sqlite
sqlite_path = ./sqlite/simple_router.db

# MySQL connection parameters (used when storage_mode = mysql)
host = localhost
port = 3306
user = root
password = 
database = ksana_llm_router
charset = utf8mb4
autocommit = true
[comm_id_allocator]
# Comm ID Allocator type: "redis" or "shared_memory"
# "redis": Use Redis server (for distributed systems)
# "shared_memory": Use /dev/shm/ file-based allocation (for single-machine multi-process)
comm_id_allocator_type = shared_memory

# Redis connection parameters (used when allocator_type = redis)
# Also used as filename suffix for shared_memory (file: /dev/shm/ksana_router_comm_id_{comm_id_key}.bin)
host = 1.1.1.1
port = 6379
password = 
db = 0
comm_id_key = PD_EXAMPLE

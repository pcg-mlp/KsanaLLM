# 全局设置
setting:
  # 全局配置
  global:
    # TP并行
    tensor_para_size: 2
    # PP并行
    pipeline_para_size: 1
    # 节点内MHA数据并行（DP）的并行数
    attn_data_para_size: 1
    # 专家并行的节点数，也是MHA数据并行的节点数目
    expert_world_size: 1
    # 节点内的专家并行数，MoE模块的 moe_tensor_para_size = tensor_para_size / expert_para_size
    expert_para_size: 1
    # 是否使用cpu保存embed_tokens
    embed_tokens_use_cpu: false
    # 是否启用cudagraph用于decode阶段加速, 当前启用默认只开启decode阶段batchsize=1,2,3
    # 不开启更多batchsize是因为每个batchsize的cudagraph实例会占用15~25mb左右显存
    enable_cuda_graph: false
    # 是否要在每个节点存储所有的 shared_expert
    enable_full_shared_expert: false
    # MoE All-to-All 通信模式（仅当 expert_world_size > 1 时生效）
    # 可选值：
    #   auto                - 自动选择（默认）：expert_world_size > 1 时启用 DeepEP Normal 模式
    #   deepep_normal       - DeepEP Normal 模式
    #   deepep_low_latency  - DeepEP Low Latency 模式
    # 注意：DeepEP 模式要求 tensor_para_size == attn_data_para_size 且 enable_full_shared_expert 为 true
    moe_all_to_all_mode: "auto"
    # DeepEP Low Latency 模式下的最大 token 数，用于缓冲区大小计算
    # 默认 256，设为 0 时回退到 max_step_tokens
    deepep_low_latency_max_tokens: 256
    # MOE topk score阈值，低于该阈值的token将被过滤，默认为0表示不过滤
    moe_topk_score_threshold: 0.0
    # PP并行（流水线并行）时通讯模式选择，默认值为default
    # default是send-receive模式，当node0推理完前面任务时，node0上device0发送数据给node1上device0，node0上device1发送数据给node1上device1。
    # scatter是scatter模式，当node0推理完前面任务时，node0上device0发送数据给node1上device0，device1，device2等等。
    pipeline_para_comm_type: "default"

  # 日志配置
  log:
    # 日志目录路径
    log_dir: "log/"
    # 单个日志文件最大大小，支持人类可读格式：512mb, 1gb, 100KB 等
    # 也支持纯数字（字节），默认 512mb
    max_file_size: "512mb"
    # 最大备份文件数，默认 2
    max_backup_count: 2

  # 调度相关配置
  batch_scheduler:
    # 调度器类型，0表示老的default scheduler，1表示event_driven_scheduler
    scheduler_type: 0
    # 调度策略，0表示continuous_batching，默认为0
    schedule_strategy: 0
    # 请求在队列中的超时时间，单位为毫秒
    waiting_timeout_in_ms: 3600000
    # 请求队列的最大等待长度，超过对应长度时会丢弃新请求，主要用于流控。
    max_waiting_queue_len: 1200
    # 一个调度step处理的最大token个数，一次context decode视为多个token。
    max_step_tokens: 4096
    # 每一步推理时的最大batch_size
    max_batch_size: 128
    # 最大输入输出长度之和, 相当于prompt_len+max_new_tokens
    max_token_len: 2048
    # 单个chunk能容纳的KV token上限，需大于等于max_token_len，默认等于max(max_token_len，max_step_tokens)
    # 增大该值可减少chunk数，降低TTFT，但会增加buffer开销
    max_chunked_kv_tokens: 0
    # 单个请求可用blck小于该值触发换出
    swapout_block_threshold: 1.0
    # 单个请求可用block大于该值触发换入
    swapin_block_threshold: 2.0
    # 单个请求可用block大于该值拉起新任务
    launch_block_threshold: 2.0
    # 是否开启自动前缀匹配
    enable_auto_prefix_cache: true
    # split_fuse_token_num用于控制在单轮推理过程中，模型处理的最大token数量。
    # 设置为256意味着在执行推理时，每个处理步骤（或“分割”）将处理最多256个token。
    # 如果设置为0，则表示不对处理的token数量进行限制，模型将尝试一次性处理整个输入。
    # 控制此参数可以帮助平衡推理速度与资源消耗，特别是在处理长文本时。
    split_fuse_token_num: 256
    # 用于执行异步swap的线程池大小
    swap_threadpool_size: 8
    # gpu block不足情况下的抢占模式，0表示SWAP，1表示RECOMPUTE
    preempt_mode: 0
    # 多轮对话场景可以设置此值，在前缀缓存查询后，继续查询非前缀的连续灵活缓存，提高cache命中率。
    # 此时命中的前缀缓存为prefix_tokens + flexible_tokens + 剩余tokens
    # 此值为最小的命中长度，推荐设置为64，值为0或超过模型最长长度表示不启用。
    min_flexible_cache_num: 0
    # 是否开启投机解码。开启后每个Step将生成一定数量的draft_tokens，成功预测的情况下可提高处理速度
    enable_speculative_decoding: false
    # 投机解码方法，支持trie（默认）/asr custom
    speculative_method: trie
    # MTP层数。如果模型中只有1层MTP但mtp_step_num大于1，将复用第一层的参数
    mtp_step_num: 1
    # 是否使用Xgrammar作为约束解码后端，开启后则进行特定格式的约束解码
    enable_xgrammar: false
    attention_dp_lb_config:
      # 是否启用ADP Balance策略，当attn_data_para_size > 1时可开启
      enable_balance: false
      # QPS阈值，当此时的qps低于min_qps_for_waiting才做prefill请求累积
      # 默认-1表示所有QPS都使用累积
      min_qps_for_waiting: -1
      # 超时迭代数，等待条件不满足时的最大等待轮数，超时后强制执行prefill
      # 如果启用自适应：低QPS时增加到200，高QPS时减少到50
      max_waiting_steps: 50
      # 超时时间（毫秒），超过此时间强制执行prefill
      # 如果启用自适应：低QPS时增加到1500ms，高QPS时减少到700ms
      max_waiting_time_in_ms: 1000
    # 是否开启async模块，开启后将使用异步调度减少GPU空泡
    enable_async: false
  # 显存块相关配置
  block_manager:
    # 单个block可处理的最大token个数
    block_token_num: 16
    # 保留的显存占比，单位为百分比。
    reserved_device_memory_ratio: 0.05
    # block部分的显存占比，<0表示使用所有剩余显存
    block_device_memory_ratio: -1.0
    # block部分在host上的预分配大小，相比device上的倍数
    block_host_memory_factor: 1.0
    # 动态可复用内存，占全量预分配时内存开销的最大比例
    dynamic_reusable_memory_ratio: 0.5
    # host内存池大小（单位GB），0表示不启用内存池
    host_pool_size_gb: 0

  # 选择attention计算中的backend
  attn_backend:
    enable_blocked_multi_token_forwarding_kv: false
    # Flash Attention 实现选择配置
    # 可选值说明：
    #   auto          - 自动选择最优实现（推荐）：系统会根据GPU架构和可用库自动选择
    #   fa3           - Flash Attention 3：适用于Hopper架构（SM >= 9.0），性能最优
    #   vllm_v26      - VLLM Flash Attention 2.6+：兼容性好，支持更多特性
    #   flashattn_v26 - 官方Flash Attention 2.6+：标准实现
    #   flashattn_v25 - 官方Flash Attention 2.5+：较老版本，兼容性最好
    # 重要编译说明：
    #   - 如果选择 flashattn_v25，需要在编译时禁用 WITH_FLASH_ATTN_CACHE 选项：
    #     cmake -DWITH_FLASH_ATTN_CACHE=OFF ...
    #   - 其他选项（fa3, vllm_v26, flashattn_v26）均支持 block table-based KV cache
    # 注意：某些模型（如Deepseek）在Hopper架构下建议使用fa3以获得最佳性能
    flash_attn_impl: auto
    # FlashInfer PagedAttention 启用控制配置
    # 可选值说明：
    #   false(默认值)   - 关闭 FlashInfer PagedAttention 后端
    #   true           - 启用 FlashInfer PagedAttention 后端
    # 重要说明：
    #    — 当前 FlashInfer_Backend 仅在 decode 阶段使用
    #    - 当前 FlashInfer_Backend 仅支持 flashinfer::BatchPrefillWithPagedKVCacheWrapper 接口
    # 架构支持：
    #    - FlashInfer_Backend 支持 sm_80; sm_86; sm_89; sm_90; sm_90a
    # 使用建议：
    #    - 对于 Qwen 非 moe 模型，建议在关闭 enable_blocked_multi_token_forwarding_kv 时启用 FlashInfer_Backend 以获取更优的性能
    use_flashinfer_for_decode: false

  # 量化相关配置
  quantization_config:
    # GPTQ/AWQ中的量化后端，支持cutlass和marlin两种，默认为cutlass
    gptq_backend: cutlass
    # block中kv cache的量化
    kv_cache:
      # 支持fp8_e5m2, fp8_e4m3和auto
      # dtype: fp8_e5m2 # fp8_e5m2为fp8的一种存储格式，对比auto速度提高约30%，精度下降约0.5%
      # dtype: fp8_e4m3 # fp8_e4m3为fp8的一种存储格式，对比auto速度提高约20%，精度损失微小
      dtype: auto # 默认值，跟随推理精度
    weight:
      # quant_method支持fp8_e4m3和auto
      # fp8_e4m3 表示推理使用fp8_e4m3(fp8的一种格式)精度
      # auto 是默认值，表示推理使用模型默认精度
      quant_method: auto
  # 性能统计相关配置
  profiler:
    #metrics_export_url: "http://example.com/v1/metrics"
    export_interval_millis: 30000
    export_timeout_millis: 1000
    attributes:
      instance: "1.1.1.1"
      container_name: "container_name_001"
      version: "1.1"
  # 服务端类型，支持python（默认）或自定义的rpc框架（如trpc/grpc）
  # 自定义的rpc框架需要在src/ksana_llm/endpoints/wrapper 目录下实现服务代码，编译
  # 为共享库f"lib{endpoint_type}_endpoint.so"，由ksana_llm查找和启动
  endpoint_type: python
  # tokenizer配置
  tokenization:
    add_special_tokens: true
    skip_special_tokens: true
# 模型配置
model_spec:
  # 基础模型配置，只能有一个
  base_model:
    # 模型路径
    # model_dir: /model/llama-hf/13B
    model_dir: /model/qwen1.5-hf/0.5B-Chat
    is_embedding_model: false
  plugin_model:
    # 插件中的模型是否使用TensorRT加速推理（e.g., 多模态中的ViT）,
    # 默认为true。设置为false则回退为Torch推理。注：TensorRT推理
    # 可能出现异常（NaN），该配置允许手动调整为Torch推理。
    enable_tensorrt: true
    # encoder分离下每个多模态encoder的处理线程数，默认为4。非分离情况会自动修改为1
    num_threads_per_encoder: 4
    # 用于多模态embedding cache的空间，默认为-1不开启缓存，值单位为GB
    multimodal_cache_size: -1
